[package]
name = "benches"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Joona Aalto <jondolf.dev@gmail.com>"]
description = "Benchmarks for Avian Physics"
repository = "https://github.com/avianphysics/avian"
readme = "README.md"

[features]
default = ["2d", "3d"]
2d = ["dep:avian2d"]
3d = ["dep:avian3d"]

[dependencies]
# Physics
avian2d = { path = "../crates/avian2d", default-features = false, features = [
    "2d",
    "parry-f32",
    "parallel",
], optional = true }
avian3d = { path = "../crates/avian3d", default-features = false, features = [
    "3d",
    "parry-f32",
    "parallel",
], optional = true }

# Bevy
bevy = { version = "0.19.0", default-features = false }

# CLI
clap = { version = "4.6", features = ["derive"] }

# Miscellaneous
rayon = { version = "1.12" }

[profile.dev]
# Make the `dev` profile equivalent to the `release` profile
# so that benchmarks are more realistic even without `--release`.
# Reference: https://doc.rust-lang.org/cargo/reference/profiles.html
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
